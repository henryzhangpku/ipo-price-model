name: ANT tracker

# Follows the listing to its first trade with the frozen model in docs/model.json
# and commits one record per change to tracker/tape.jsonl, the page's feed.
#
# The model is never refitted here: its SHA-256 is in every record. Only the T-1
# inputs move: the issuer's EDGAR filings, recent listings' first-day moves, and,
# after the first trade, the first close that scores the published band.

on:
  schedule:
    # 13:35 UTC: 08:35 New York / 05:35 Pacific in winter (an hour later in summer),
    # after the overnight and early-morning EDGAR filings.
    - cron: "35 13 * * 1-5"
    # 02:35 UTC: 21:35 New York / 18:35 Pacific in winter (an hour later in summer),
    # after a deal prices in the evening.
    - cron: "35 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two runs must never append to the tape at once.
  group: ant-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Done already?
        # Once the band is scored the test is over: every later run stops here.
        id: done
        run: |
          stage=$(tail -1 tracker/tape.jsonl | python3 -c 'import json,sys; print(json.load(sys.stdin)["stage"])')
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          if [ "$stage" = scored ]; then echo "::notice::The record is scored; nothing left to track."; fi

      - uses: astral-sh/setup-uv@v5
        if: steps.done.outputs.stage != 'scored'
        with:
          enable-cache: true

      - name: Install
        if: steps.done.outputs.stage != 'scored'
        run: uv sync --frozen --extra dev

      - name: Tests
        # A change that breaks its own claims must not reach the tape.
        if: steps.done.outputs.stage != 'scored'
        run: uv run pytest -q

      - name: Track
        if: steps.done.outputs.stage != 'scored'
        id: track
        run: |
          uv run ipo-price-model track --deal tracker/ant.json | tee track.log
          echo "headline=$(head -1 track.log)" >> "$GITHUB_OUTPUT"

      - name: Commit the record
        if: steps.done.outputs.stage != 'scored'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/tape.jsonl tracker/regime_listings.json docs/live.json
          if git diff --cached --quiet; then
            echo "No change since the last record."
            exit 0
          fi
          git commit -m "ANT tracker $(date -u +%F): ${{ steps.track.outputs.headline }}"
          git push

      - name: Check the test can still be scored
        # After the commit, so the record is kept either way. A failed run emails the repo owner:
        # a prospectus with no price read, a first-trade date gone by with no prospectus, or no first close.
        if: steps.done.outputs.stage != 'scored'
        run: uv run ipo-price-model check
