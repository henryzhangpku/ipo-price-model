<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
/* The 1200x627 link-preview image (docs/og.png). Rendered with headless Chrome; not linked from the site. */
html,body{margin:0;width:1200px;height:627px;overflow:hidden}
body{background:#f8fafc;font-family:Inter,sans-serif;color:#072b46;position:relative;
  background-image:linear-gradient(#e3e9ef 1px,transparent 1px),linear-gradient(90deg,#e3e9ef 1px,transparent 1px);background-size:64px 64px}
.wrap{position:absolute;inset:0;padding:56px 72px;display:flex;flex-direction:column}
.mark{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:20px}
.mark svg{width:30px;height:30px}
h1{font:400 64px/1.05 Newsreader,Georgia,serif;letter-spacing:-.02em;margin:34px 0 0;max-width:900px}
.card{margin-top:auto;background:#fff;border:1px solid #e3e9ef;border-radius:18px;box-shadow:0 10px 30px rgba(7,43,70,.08);padding:28px 34px;display:flex;align-items:center;gap:40px}
.lab{white-space:nowrap;font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#1d6aa5}
.big{font:400 104px/1 Newsreader,Georgia,serif;letter-spacing:-.03em;margin-top:6px}
.side{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.pill{display:inline-block;background:#e2f4ea;color:#1d7a4c;font-weight:600;font-size:22px;padding:8px 16px;border-radius:10px}
.note{font-size:20px;color:#536f7d}
.live{position:absolute;top:58px;right:72px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;color:#536f7d}
.dot{width:12px;height:12px;border-radius:50%;background:#2e8bd0;box-shadow:0 0 0 6px rgba(46,139,208,.18)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 20 L10 6 L13 12" fill="none" stroke="#072b46" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M12 20 L17 10 L21 20" fill="none" stroke="#2e8bd0" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>IPO Price Model</div>
  <div class="live"><span class="dot"></span>Live tracker · updated every weekday</div>
  <h1>Pricing Anthropic (ANT) the night before it trades</h1>
  <div class="card">
    <div>
      <div class="lab">Anthropic · Nasdaq: ANT</div>
      <div class="big" style="white-space:nowrap;font-size:88px">First-day band</div>
    </div>
    <div class="side">
      <span class="pill">Live, from its S-1 to its first close</span>
      <span class="note">Frozen open-source model · scored in public after the first close</span>
    </div>
  </div>
</div>
</body>
</html>
